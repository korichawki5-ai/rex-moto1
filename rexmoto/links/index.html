<head>
  <meta charset="UTF-8" />

  <style>
    :root {
      --bg: #0a0d12;
      --card: #121822;
      --line: rgba(255, 255, 255, 0.08);
      --txt: #e9eef5;
      --muted: #8a96a6;
      --accent: #e11d48;
      --accent2: #f43f5e;
      --accent-dim: rgba(225, 29, 72, 0.14);
      --display: "Space Grotesk", "Alexandria", sans-serif;
      --body: "Alexandria", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--txt);
      font-family: var(--body);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-tap-highlight-color: transparent;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      inset-inline: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent));
    }

    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .page {
      max-width: 400px;
      margin: 0 auto;
      padding: 40px 20px 40px;
    }

    /* Brand */
    header {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-family: var(--display);
      font-weight: 700;
      font-size: 24px;
      letter-spacing: 0.5px;
      direction: ltr;
    }

    .brand svg {
      width: 36px;
      height: 36px;
      filter: drop-shadow(0 0 10px rgba(225, 29, 72, 0.4));
    }

    .brand .x { color: var(--accent); font-size: 1.3em; }

    .tagline {
      margin-top: 10px;
      font-size: 14px;
      color: var(--muted);
    }

    /* Links */
    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: 16px;
      background: var(--card);
      border: 1px solid var(--line);
      transition: 0.25s var(--ease);
    }

    .link:hover,
    .link:focus-visible {
      border-color: rgba(225, 29, 72, 0.45);
      transform: translateY(-2px);
      outline: none;
    }

    .link:active { transform: none; }

    .icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      background: var(--accent-dim);
      color: var(--accent2);
    }

    .icon svg { width: 20px; height: 20px; }

    .icon.ig { background: rgba(225, 48, 108, 0.12); color: #E1306C; }
    .icon.tt { background: rgba(255, 255, 255, 0.05); color: var(--txt); }
    .icon.fb { background: rgba(24, 119, 242, 0.12); color: #1877F2; }
    .icon.maps { background: rgba(90, 167, 255, 0.12); color: #5aa7ff; }
    .icon.phone { background: rgba(61, 220, 151, 0.12); color: #3ddc97; }
    .icon.wa { background: rgba(37, 211, 102, 0.12); color: #25D366; }

    .meta { flex: 1; min-width: 0; text-align: right; }

    .meta .title {
      font-family: var(--display);
      font-weight: 600;
      font-size: 15.5px;
    }

    .meta .sub {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
      direction: ltr;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chev {
      color: var(--muted);
      flex-shrink: 0;
      opacity: 0.6;
    }

    .chev svg {
      width: 18px;
      height: 18px;
      transform: scaleX(-1);
      display: block;
    }

    /* Primary site button */
    .link.primary {
      background: linear-gradient(135deg, var(--accent), #c0173c);
      border-color: transparent;
      box-shadow: 0 12px 28px -12px rgba(225, 29, 72, 0.55);
    }

    .link.primary .icon {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .link.primary .meta .title,
    .link.primary .chev { color: #fff; }

    .link.primary .meta .sub { color: rgba(255, 255, 255, 0.75); }

    .link.primary:hover {
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      border-color: transparent;
    }

    footer {
      margin-top: 28px;
      text-align: center;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
    }

    footer a {
      color: var(--accent2);
    }
  </style>
</head>

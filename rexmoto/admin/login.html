<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>تسجيل الدخول — REX MOTO</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M14 8 34 22l-12 2 6 16L14 26l12-2-12-6z' fill='%23e11d48'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/admin.css">
<script src="../assets/js/config.js"></script>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-mark"><svg width="40" height="40" viewBox="0 0 48 48" fill="none"><path d="M14 8 34 22l-12 2 6 16L14 26l12-2-12-6z" fill="#e11d48" stroke="#e11d48" stroke-width="1" stroke-linejoin="round"/></svg></div>
      <h1>REX<span>MOTO</span></h1>
      <p>لوحة الإدارة — تسجيل الدخول</p>
    </div>
    <form id="loginForm">
      <div class="login-field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="email" required autocomplete="email" dir="ltr" placeholder="admin@rexmoto.com">
      </div>
      <div class="login-field">
        <label>كلمة المرور</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="login-btn" id="loginBtn">دخول</button>
      <div class="login-msg" id="loginMsg"></div>
      <div class="login-foot">
        <a id="forgotBtn">نسيت كلمة المرور؟</a>
      </div>
    </form>
    <div class="login-back"><a href="../index.html">← العودة للمتجر</a></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-auth.js";

const cfg = window.REXMOTO_CONFIG;
let app, auth;
try {
  app = initializeApp(cfg.firebase);
  auth = getAuth(app);
} catch (e) {
  document.getElementById("loginMsg").className = "login-msg err";
  document.getElementById("loginMsg").textContent = "تحقق من إعدادات Firebase في config.js";
}

const msg = (text, type) => {
  const el = document.getElementById("loginMsg");
  el.className = "login-msg " + (type || "err");
  el.textContent = text;
};

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("loginBtn");
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  try {
    await signInWithEmailAndPassword(auth, email, password);
    location.href = "index.html";
  } catch (err) {
    let m = "بيانات الدخول غير صحيحة";
    if (err.code === "auth/user-not-found") m = "لا يوجد حساب بهذا البريد";
    if (err.code === "auth/wrong-password") m = "كلمة المرور غير صحيحة";
    if (err.code === "auth/invalid-email") m = "البريد الإلكتروني غير صالح";
    if (err.code === "auth/too-many-requests") m = "محاولات كثيرة، حاول لاحقاً";
    if (err.code === "auth/network-request-failed") m = "تحقق من اتصالك بالإنترنت";
    msg(m, "err");
  } finally {
    btn.disabled = false; btn.textContent = "دخول";
  }
});

document.getElementById("forgotBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  if (!email) return msg("أدخل بريدك أولاً ثم اضغط نسيت كلمة المرور", "err");
  try {
    await sendPasswordResetEmail(auth, email);
    msg("تم إرسال رابط إعادة التعيين إلى بريدك", "ok");
  } catch (e) {
    msg("تعذّر الإرسال، تحقق من البريد", "err");
  }
});
</script>
</body>
</html>
